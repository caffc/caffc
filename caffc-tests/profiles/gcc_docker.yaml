# Profile: gcc_docker
#
# CaffC compilation runs locally (x86_64). C compilation, linking, and
# execution run inside a shared gcc Docker container.
#
# Uses the caffc-gcc-asan Docker image built from Dockerfile.gcc_asan
# (ubuntu:22.04 + gcc).
#
# Container is started once, all tests run via docker exec, then stopped.
#
# Usage:
#   python3 run-tests.py -p gcc_docker
#   python3 run-tests.py -p gcc_docker hello-world-caffc
#
# Prerequisites:
#   - Docker installed
#   - Built the caffc-gcc-asan image:
#       docker build -f Dockerfile.gcc_asan -t caffc-gcc-asan:latest .

config:
  caffc_cmd: java -jar ../../target/caffc-*.jar

  docker_container_name: caffc-gcc-docker
  docker_mount_source: ../..
  docker_run_command: docker run -d --name {container_name} -u $(id -u):$(id -g) -v {mount_source}:{mount_source} caffc-gcc-asan tail -f /dev/null
  docker_exec_prefix: docker exec -w {cwd} {container_name} bash -c

  compile_cmd_template: gcc -Wall -g -ggdb -c {file} -o {output}
  link_cmd_template: gcc {objects} -o {output}
  execute_cmd_template: ./target/main