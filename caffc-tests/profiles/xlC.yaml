# Profile: xlc_docker
#
# CaffC compilation runs locally (x86_64). C compilation, linking, and
# execution run inside a shared ibmcom/xlc-ce Docker container on ppc64le.
#
# Container is started once as root (to accept license), then each exec
# uses su to run as the current user.
#
# Usage:
#   python3 run-tests.py -p xlc_docker
#   python3 run-tests.py -p xlc_docker hello-world-caffc
#
# Prerequisites:
#   - Docker installed
#   - QEMU emulation for ppc64le (if host is not ppc64le):
#       docker run --rm --privileged tonistiigi/binfmt --install all

config:
  # CaffC compiles locally (x86_64 Java), produces .c files
  caffc_cmd: java -jar ../../target/caffc-*.jar

  docker_container_name: caffc-xlc-docker
  docker_mount_source: ../..
  docker_run_command: docker run -d --name {container_name} -e LICENSE=accept -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v {mount_source}:{mount_source} --platform ppc64le ibmcom/xlc-ce tail -f /dev/null
  docker_exec_prefix: docker exec -w {cwd} {container_name} bash -c
  docker_ready_command: which xlC

  compile_cmd_template: xlC -q64 -c {file} -o {output}
  link_cmd_template: xlC -q64 {objects} -o {output}
  execute_cmd_template: ./target/main