# Profile: xlc_docker
#
# CaffC compilation runs locally (x86_64). C compilation, linking, and
# execution run inside the ibmcom/xlc-ce Docker container on ppc64le.
#
# The container starts as root to accept the IBM license, then switches
# to the current user via `su -c "xlC ..." $(whoami)`.
#
# Usage:
#   python3 run-tests.py -p xlc_docker
#   python3 run-tests.py -p xlc_docker hello-world-caffc
#
# Prerequisites:
#   - Docker installed
#   - QEMU emulation for ppc64le (if host is not ppc64le):
#       docker run --rm --privileged tonistiigi/binfmt --install all
#
# Volume mapping:
#   Host <test_dir>  ->  /test (inside container)

config:
  # CaffC compiles locally (x86_64 Java), produces .c files
  caffc_cmd: java -jar ../../target/caffc-*.jar

  # Compile each .c file inside the ppc64le container.
  # Container starts as root for license, then su to current user.
  # Path mapping: host $(pwd) -> container $(pwd) so compiler paths work.
  compile_cmd_template: |
    docker run --rm -e LICENSE=accept -u root -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v $(pwd):$(pwd) -w $(pwd) --platform ppc64le ibmcom/xlc-ce su -c 'xlC -q64 -c {file} -o {output}' $(whoami)

  # Link inside the ppc64le container
  link_cmd_template: |
    docker run --rm -e LICENSE=accept -u root -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v $(pwd):$(pwd) -w $(pwd) --platform ppc64le ibmcom/xlc-ce su -c 'xlC -q64 {objects} -o {output}' $(whoami)

  # Execute inside the ppc64le container
  execute_cmd_template: |
    docker run --rm -e LICENSE=accept -u root -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro -v $(pwd):$(pwd) -w $(pwd) --platform ppc64le ibmcom/xlc-ce su -c './target/main' $(whoami)