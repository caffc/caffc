# Profile: clang_docker
#
# CaffC compilation runs locally (x86_64). C compilation, linking, and
# execution run inside a shared clang Docker container.
#
# Uses the caffc-clang Docker image built from Dockerfile.clang
# (ubuntu:22.04 + clang-14).
#
# Container is started once, all tests run via docker exec, then stopped.
#
# Usage:
#   python3 run-tests.py -p clang_docker
#   python3 run-tests.py -p clang_docker hello-world-caffc
#
# Prerequisites:
#   - Docker installed
#   - Built the caffc-clang image:
#       docker build -f Dockerfile.clang -t caffc-clang:latest .

config:
  caffc_cmd: java -jar ../../target/caffc-*.jar

  docker_container_name: caffc-clang-docker
  docker_mount_source: ../..
  docker_run_command: docker run -d --name {container_name} -u $(id -u):$(id -g) -v {mount_source}:{mount_source} caffc-clang tail -f /dev/null
  docker_exec_prefix: docker exec -w {cwd} {container_name} bash -c

  compile_cmd_template: clang -Wall -g -ggdb -c {file} -o {output}
  link_cmd_template: clang {objects} -o {output}
  execute_cmd_template: ./target/main